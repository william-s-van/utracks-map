  gb_england:'https://www.utracks.com/croppedImages/Utracks/England/Coast-to-Coast/Coast-to-Coast-2408718-1920px-16x7.jpg',
  cy_cyprus:'https://www.utracks.com/croppedImages/Utracks/Cyprus/Troodos/Cyprus-Troodos-2408720-1920px-16x7.jpg',

// Fallback images by type (known good UTracks images)
var FALLBACKS = {
  walking: 'https://www.utracks.com/croppedImages/Utracks/Walking/walking-europe-hero-2408720-1920px-16x7.jpg',
  cycling: 'https://www.utracks.com/croppedImages/Utracks/Cycling/cycling-europe-hero-2408722-1920px-16x7.jpg',
  camino:  'https://www.utracks.com/croppedImages/Utracks/Camino/camino-hero-2408724-1920px-16x7.jpg',
  boat:    'https://www.utracks.com/croppedImages/Utracks/Bike-Boat/bike-boat-hero-2408726-1920px-16x7.jpg',
  alpine:  'https://www.utracks.com/croppedImages/Utracks/Alpine/alpine-hero-2408728-1920px-16x7.jpg',
};

var activeFilter = 'all';
var activeId = null;
var layers = {};

var map = L.map('map', {zoomControl:true}).setView([48.0, 8.0], 4);
setTimeout(function(){map.invalidateSize();}, 300);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom:19
}).addTo(map);

function getMainType(d) {
  return Array.isArray(d.types) ? d.types[0] : d.types;
}

function pinColor(d) {
  return TYPE_COLOR[getMainType(d)] || ORANGE;
}

function makeIcon(col, sz, border) {
  return L.divIcon({
    className:'',
    html:'<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+col+';border:'+(border||2.5)+'px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>',
    iconSize:[sz,sz], iconAnchor:[sz/2,sz/2]
  });
}

function isVisible(d) {
  if (activeFilter === 'all') return true;
  return Array.isArray(d.types) ? d.types.indexOf(activeFilter) > -1 : d.types === activeFilter;
}

destinations.forEach(function(d) {
  var col = pinColor(d);
  var m = L.marker([d.lat, d.lng], {icon: makeIcon(col, 14, 2)}).addTo(map);
  m.bindTooltip(d.name, {permanent:false, direction:'top', className:'route-tooltip', offset:[0,-8], sticky:false});
  m.on('click', function() { openPanel(d); });
  layers[d.id] = {marker: m};
});

// Filter buttons
document.querySelectorAll('.filter-btn[data-f]').forEach(function(b) {
  b.addEventListener('click', function(e) {
    e.preventDefault(); e.stopPropagation();
    activeFilter = b.getAttribute('data-f');
    document.querySelectorAll('.filter-btn[data-f]').forEach(function(x) {
      x.classList.toggle('active', x.getAttribute('data-f') === activeFilter);
    });
    destinations.forEach(function(d) {
      var v = isVisible(d);
      layers[d.id].marker.setIcon(makeIcon(v ? pinColor(d) : MUTED, v ? 14 : 10, 2));
      layers[d.id].marker.setOpacity(v ? 1 : 0.25);
    });
  });
});

function metaItem(l, v) {
  return '<div class="meta-item"><div class="meta-label">'+l+'</div><div class="meta-value">'+v+'</div></div>';
}

function openPanel(d) {
  activeId = d.id;

  // Update markers
  destinations.forEach(function(x) {
    var active = x.id === d.id;
    var v = isVisible(x);
    layers[x.id].marker.setIcon(makeIcon(active ? pinColor(x) : (v ? pinColor(x) : MUTED), active ? 20 : (v ? 14 : 10), active ? 3 : 2));
    layers[x.id].marker.setOpacity(active ? 1 : (v ? 0.4 : 0.15));
  });

  // Hero image — try destination photo, fall back gracefully
  var hero = document.getElementById('d-hero');
  var ex = hero.querySelector('img'); if (ex) ex.remove();
  var img = document.createElement('img');
  img.alt = d.name;
  img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
  var mainType = getMainType(d);
  img.src = PHOTOS[d.id] || FALLBACKS[mainType] || '';
  img.onerror = function() { this.style.display='none'; hero.style.background='#e8f4f0'; };
  hero.insertBefore(img, hero.firstChild);

  // Click hero to go to hub
  if (d.hub) {
    hero.style.cursor = 'pointer';
    hero.onclick = function() { window.open(d.hub, '_blank'); };
  } else {
    hero.style.cursor = 'default';
    hero.onclick = null;
  }

  // Title
  document.getElementById('d-title').innerHTML = d.hub
    ? '<a href="'+d.hub+'" target="_blank" rel="noopener">'+d.name+'</a>'
    : d.name;

  // Tags
  var tagsHtml = '';
  var typesArr = Array.isArray(d.types) ? d.types : [d.types];
  typesArr.forEach(function(t) {
    tagsHtml += '<span class="tag '+TYPE_TAG[t]+'">'+TYPE_EMOJI[t]+' '+TYPE_LABEL[t]+'</span>';
  });
  document.getElementById('d-tags').innerHTML = tagsHtml;

  // Meta
  var tourCount = d.tours ? d.tours.length : 0;
  var meta = metaItem('Country', d.country) + metaItem('Tours', tourCount);
  document.getElementById('d-meta').innerHTML = meta;

  // Desc
  document.getElementById('d-desc').textContent = d.desc;

  // Tours list — group by type if multi-type
  var itinsEl = document.getElementById('d-itins');
  var headingEl = document.getElementById('d-tours-heading');
  headingEl.textContent = 'Tours (' + tourCount + ')';

  if (d.tours && d.tours.length > 0) {
    headingEl.style.display = 'block';
    itinsEl.innerHTML = d.tours.map(function(t) {
      var col = TYPE_COLOR[t.t] || ORANGE;
      var emoji = TYPE_EMOJI[t.t] || '';
      return '<a class="itinerary-item" href="'+t.u+'" target="_blank" rel="noopener">'
        + '<span class="itin-name">'+t.n+'</span>'
        + '<span style="font-size:13px;color:'+col+';flex-shrink:0;margin-left:6px">'+emoji+'</span>'
        + '<span class="itin-arrow">›</span>'
        + '</a>';
    }).join('');
  } else {
    headingEl.style.display = 'none';
    itinsEl.innerHTML = '';
  }

  // CTA
  document.getElementById('d-cta').innerHTML = d.hub
    ? '<a class="cta-btn" href="'+d.hub+'" target="_blank" rel="noopener">Explore all tours →</a>'
    : '';

  // Show panel
  document.getElementById('panel-default').style.display = 'none';
  var det = document.getElementById('panel-detail');
  det.style.display = 'flex'; det.classList.add('active');
  document.getElementById('panel').classList.add('mobile-open');
  det.scrollTop = 0;

  // Zoom
  var zoom = d.types && d.types.indexOf('camino') > -1 ? 7 : Math.max(map.getZoom(), 6);
  map.setView([d.lat, d.lng], zoom, {animate: true});
}

function closePanel() {
  activeId = null;
  destinations.forEach(function(d) {
    var v = isVisible(d);
    layers[d.id].marker.setIcon(makeIcon(v ? pinColor(d) : MUTED, v ? 14 : 10, 2));
    layers[d.id].marker.setOpacity(v ? 1 : 0.25);
  });
  document.getElementById('panel-default').style.display = '';
  var det = document.getElementById('panel-detail');
  det.style.display = 'none'; det.classList.remove('active');
  document.getElementById('panel').classList.remove('mobile-open');
  map.setView([48.0, 8.0], 4, {animate: true});
}

map.on('click', function() {
  if (window.innerWidth <= 600 && document.getElementById('panel').classList.contains('mobile-open')) closePanel();
});

document.getElementById('btn-fullscreen').addEventListener('mousedown', function(e) {
  e.preventDefault(); e.stopPropagation();
  var w = document.getElementById('map-wrapper');
  var isFs = w.classList.toggle('fullscreen');
  this.textContent = isFs ? '✕ Exit' : '⛶ Expand';
  map.invalidateSize();
});
</script>
