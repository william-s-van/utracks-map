<style>
:root {
  --orange: #e8500a;
  --orange-hover: #c43d07;
  --navy: #1a2340;
  --charcoal: #3d4454;
  --walk: #1d6746;
  --cycle: #e8500a;
  --camino: #6b21a8;
  --boat: #0369a1;
  --alpine: #0c4a6e;
  --ink: #1a1a1a;
  --ink-soft: #4a4a4a;
  --ink-muted: #8a8a8a;
  --line: rgba(60,70,90,0.10);
  --line-strong: rgba(60,70,90,0.20);
  --surface: #f4f5f7;
  --surface-2: #ecedf0;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.16);
  --radius: 4px;
  --radius-lg: 8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Inter Tight',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:var(--surface);line-height:1.5;-webkit-font-smoothing:antialiased;height:100%}

/* ── MAP WRAP ── */
.ut-map-wrap{position:relative;width:100%;max-width:1200px;margin:0 auto;padding:0 24px 24px}
.ut-map{position:relative;width:100%;aspect-ratio:16/7.5;border-radius:var(--radius-lg);overflow:hidden;background:var(--surface-2);box-shadow:var(--shadow-lg);border:1px solid var(--line-strong)}
#map{width:100%;height:100%}

/* ── MARKERS ── */
.ut-marker{width:28px;height:36px;cursor:pointer;background:transparent!important;border:none!important;padding:0!important;margin:0!important;box-shadow:none!important;outline:none!important}
.ut-marker:focus,.ut-marker:focus-visible{outline:none}
.ut-marker-inner{position:relative;width:100%;height:100%;display:block;transform-origin:50% 100%;transition:transform .22s cubic-bezier(.34,1.56,.64,1),filter .22s ease;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));will-change:transform;background:transparent}
.ut-marker-inner svg{width:100%;height:100%;display:block;background:transparent}
.ut-marker:hover .ut-marker-inner,.ut-marker.is-active .ut-marker-inner{transform:scale(1.25);filter:drop-shadow(0 5px 8px rgba(0,0,0,.45))}
.ut-marker:hover,.ut-marker.is-active{z-index:5}
.mapboxgl-marker{background:transparent!important;border:none!important}
.ut-marker.is-dimmed .ut-marker-inner{opacity:.18;filter:grayscale(.5) drop-shadow(0 1px 2px rgba(0,0,0,.18))}
.ut-marker.is-dimmed:hover .ut-marker-inner{opacity:.5;transform:scale(1.2)}

/* Tooltip */
.ut-tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%) translateY(4px);background:rgba(26,26,26,.95);color:#fff;font-size:12px;font-weight:600;white-space:nowrap;padding:6px 10px;border-radius:4px;pointer-events:none;opacity:0;transition:opacity .15s,transform .15s;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:6;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.ut-tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:rgba(26,26,26,.95)}
.ut-marker:hover .ut-tip{opacity:1;transform:translateX(-50%) translateY(0)}
.ut-marker.is-active .ut-tip{opacity:0}
@media(hover:none){.ut-tip{display:none}}

/* ── LEGEND / FILTER ── */
.ut-legend{position:absolute;bottom:16px;left:16px;z-index:10;display:flex;gap:4px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-radius:6px;border:1px solid var(--line-strong);box-shadow:var(--shadow-md);padding:5px 7px;font-size:12px;font-weight:600;flex-wrap:wrap}
.ut-legend-btn{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:inherit;font-weight:600;color:var(--ink-soft);transition:background .12s,color .12s;white-space:nowrap;letter-spacing:.01em}
.ut-legend-btn:hover{background:var(--line);color:var(--ink)}
.ut-legend-btn.is-active{background:var(--orange);color:#fff}
.ut-legend-btn[data-t="walking"].is-active{background:var(--walk)}
.ut-legend-btn[data-t="cycling"].is-active{background:var(--cycle)}
.ut-legend-btn[data-t="camino"].is-active{background:var(--camino)}
.ut-legend-btn[data-t="boat"].is-active{background:var(--boat)}
.ut-legend-btn[data-t="alpine"].is-active{background:var(--alpine)}
.ut-legend.is-filtering .ut-legend-btn:not(.is-active){opacity:.5}
.ut-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ── SEARCH ── */
.ut-search{position:absolute;top:16px;left:16px;z-index:15;width:290px}
.ut-search-box{display:flex;align-items:center;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-radius:6px;border:1px solid var(--line-strong);box-shadow:var(--shadow-md);padding:0 10px;gap:6px;height:40px}
.ut-search-icon{width:15px;height:15px;color:var(--ink-muted);flex-shrink:0}
.ut-search-input{flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:13.5px;color:var(--ink);min-width:0}
.ut-search-input::placeholder{color:var(--ink-muted)}
.ut-search-clear{background:none;border:none;cursor:pointer;font-size:18px;color:var(--ink-muted);padding:0;line-height:1;display:none}
.ut-search-clear.show{display:block}
.ut-search-results{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:rgba(255,255,255,.98);backdrop-filter:blur(10px);border-radius:6px;border:1px solid var(--line-strong);box-shadow:var(--shadow-lg);overflow:hidden;max-height:300px;overflow-y:auto}
.ut-search-results.show{display:block}
.ut-search-result{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;cursor:pointer;background:none;border:none;width:100%;text-align:left;font-family:inherit;border-bottom:1px solid var(--line);transition:background .12s}
.ut-search-result:last-child{border-bottom:none}
.ut-search-result:hover,.ut-search-result.hl{background:var(--surface)}
.ut-search-dot{flex-shrink:0;width:10px;height:10px;border-radius:50%;margin-top:5px;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.15)}
.ut-search-name{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.25}
.ut-search-name mark{background:rgba(232,80,10,.15);color:inherit;padding:0 1px;border-radius:2px}
.ut-search-meta{font-size:11.5px;color:var(--ink-muted);margin-top:2px}
.ut-search-empty{padding:16px 14px;font-size:13px;color:var(--ink-muted);text-align:center}

/* ── RESET ── */
.ut-reset{position:absolute;top:16px;right:52px;z-index:15;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border:1px solid var(--line-strong);border-radius:6px;box-shadow:var(--shadow-md);padding:0 10px;height:40px;font-family:inherit;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:background .12s,color .12s;white-space:nowrap}
.ut-reset:hover{background:var(--surface-2);color:var(--ink)}
.ut-reset svg{width:13px;height:13px;flex-shrink:0}

/* ── PANEL ── */
.ut-panel{position:absolute;top:16px;bottom:16px;right:16px;width:330px;max-width:calc(100% - 32px);background:#fff;border-radius:var(--radius-lg);border:1px solid var(--line-strong);box-shadow:var(--shadow-lg);overflow:hidden;z-index:20;display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none;transition:transform .38s cubic-bezier(.32,.72,0,1),opacity .25s ease}
.ut-panel.open{transform:translateX(0);opacity:1;pointer-events:auto}
.ut-panel-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.ut-close{position:absolute;top:12px;right:12px;z-index:3;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;transition:background .15s}
.ut-close:hover{background:rgba(0,0,0,.78)}
.ut-hero{position:relative;width:100%;aspect-ratio:16/9;background:var(--surface-2) center/cover no-repeat;flex-shrink:0}
.ut-hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.5) 0%,transparent 55%)}
.ut-hero-badge{position:absolute;bottom:12px;left:12px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;border-radius:3px;padding:3px 8px}
.ut-body{padding:16px 16px 20px;display:flex;flex-direction:column;flex:1}
.ut-panel-country{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
.ut-panel-name{font-size:16px;font-weight:700;color:var(--ink);line-height:1.25;letter-spacing:-.01em;margin-bottom:10px}
.ut-panel-desc{font-size:13px;color:var(--ink-soft);line-height:1.55;margin-bottom:14px}

/* Type tags */
.ut-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.ut-tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;color:#fff}
.ut-tag-walk{background:var(--walk)}
.ut-tag-cycle{background:var(--cycle)}
.ut-tag-camino{background:var(--camino)}
.ut-tag-boat{background:var(--boat)}
.ut-tag-alpine{background:var(--alpine)}

/* Tour list */
.ut-tours-heading{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:8px}
.ut-tours-list{flex:1;overflow-y:auto;max-height:240px;margin-bottom:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ut-tour-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none}
.ut-tour-item:last-child{border-bottom:none}
.ut-tour-item:hover .ut-tour-name{color:var(--orange)}
.ut-tour-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ut-tour-name{font-size:12.5px;color:var(--ink);flex:1;line-height:1.35;transition:color .12s}
.ut-tour-arrow{font-size:14px;color:var(--line-strong);flex-shrink:0}

/* CTA */
.ut-cta{background:var(--orange);color:#fff;text-decoration:none;padding:13px 18px;border-radius:var(--radius);font-weight:600;font-size:13px;letter-spacing:.02em;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;border:none;cursor:pointer}
.ut-cta:hover{background:var(--orange-hover);color:#fff}
.ut-cta svg{width:12px;height:12px;flex-shrink:0}

/* ── MOBILE ── */
@media(max-width:768px){
  .ut-search{display:none!important}
  .ut-map-wrap{padding:0 10px 10px}
  .ut-map{aspect-ratio:3/4;border-radius:var(--radius)}
  .ut-legend{bottom:10px;left:10px;font-size:11px;padding:4px 5px;gap:2px}
  .ut-legend-btn{padding:4px 6px;gap:4px}
  .ut-panel{top:auto;bottom:0;left:0;right:0;width:100%;max-width:100%;border-radius:var(--radius-lg) var(--radius-lg) 0 0;transform:translateY(calc(100% + 24px));max-height:80%}
  .ut-panel.open{transform:translateY(0)}
  .ut-hero{aspect-ratio:16/7}
  .ut-tours-list{max-height:180px}
  .ut-reset{right:52px}
}
.mapboxgl-ctrl-bottom-right .mapboxgl-ctrl{margin-right:8px!important;margin-bottom:8px!important}
</style>

/* ── PIN SVG ── */
const PIN_SVG = (color) => `
  <div class="ut-marker-inner">
    <svg viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M14 1.5C7.1 1.5 1.5 7.1 1.5 14c0 4.3 2.8 9.4 6.1 13.6 2 2.6 4 4.7 5.2 5.9a1.7 1.7 0 0 0 2.4 0c1.2-1.2 3.2-3.3 5.2-5.9 3.3-4.2 6.1-9.3 6.1-13.6 0-6.9-5.6-12.5-12.5-12.5z" fill="#ffffff"/>
      <path d="M14 3.5C8.2 3.5 3.5 8.2 3.5 14c0 3.7 2.5 8.2 5.6 12.2 1.9 2.4 3.8 4.4 4.9 5.5a.1.1 0 0 0 .1 0c1.1-1.1 3-3.1 4.9-5.5 3.1-4 5.5-8.5 5.5-12.2 0-5.8-4.7-10.5-10.5-10.5z" fill="${color}"/>
      <circle cx="14" cy="14" r="3.5" fill="#ffffff"/>
    </svg>
  </div>`;

function destColor(d) {
  const t = Array.isArray(d.types) ? d.types[0] : d.types;
  return TYPE_COLOR[t] || '#888';
}

/* ── MAP INIT ── */
mapboxgl.accessToken = MAPBOX_TOKEN;
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/outdoors-v12',
  center: [10.0, 47.0],
  zoom: 3.5,
  minZoom: 2,
  maxZoom: 14,
  cooperativeGestures: true,
});
map.addControl(new mapboxgl.NavigationControl({showCompass:false}), 'top-right');

const state = {activeId:null, markers:[], filter:null};
const DEFAULT_BOUNDS = new mapboxgl.LngLatBounds();
const DEFAULT_PAD = {top:60,bottom:80,left:60,right:60};

/* ── BUILD MARKERS ── */
function buildMarkers() {
  DESTS.forEach(d => {
    const col = destColor(d);
    const el = document.createElement('div');
    el.className = 'ut-marker';
    el.innerHTML = PIN_SVG(col);
    el.setAttribute('role','button');
    el.setAttribute('aria-label', d.name + ' — ' + d.country);
    el.tabIndex = 0;

    const tip = document.createElement('div');
    tip.className = 'ut-tip';
    tip.textContent = d.name;
    el.appendChild(tip);

    const marker = new mapboxgl.Marker({element:el, anchor:'bottom'})
      .setLngLat([d.lng, d.lat]).addTo(map);

    el.addEventListener('click', e => { e.stopPropagation(); openPanel(d, el); });
    el.addEventListener('keypress', e => { if(e.key==='Enter'||e.key===' '){e.preventDefault();openPanel(d,el);} });

    state.markers.push({marker, element:el, dest:d});
    DEFAULT_BOUNDS.extend([d.lng, d.lat]);
  });
}

/* ── PANEL ── */
const panelEl = document.getElementById('ut-panel');
const panelScroll = document.getElementById('ut-panel-scroll');

function buildPanelHTML(d) {
  const types = Array.isArray(d.types) ? d.types : [d.types];
  const tags = types.map(t =>
    `<span class="ut-tag ut-tag-${t}">${TYPE_EMOJI[t]} ${TYPE_LABEL[t]}</span>`
  ).join('');

  const mainColor = TYPE_COLOR[types[0]] || '#888';

  const tours = (d.tours||[]).map(t =>
    `<a class="ut-tour-item" href="${t.u}" target="_blank" rel="noopener">
      <span class="ut-tour-dot" style="background:${TYPE_COLOR[t.t]||mainColor}"></span>
      <span class="ut-tour-name">${t.n}</span>
      <span class="ut-tour-arrow">›</span>
    </a>`
  ).join('');

  return `
    <button type="button" class="ut-close" id="ut-close-btn" aria-label="Close">&#x2715;</button>
    <div class="ut-hero" style="background-color:${mainColor}20">
      <div class="ut-hero-overlay"></div>
      <span class="ut-hero-badge" style="background:${mainColor}">${d.country}</span>
    </div>
    <div class="ut-body">
      <div class="ut-panel-country">${d.country}</div>
      <h2 class="ut-panel-name">${d.name}</h2>
      <div class="ut-tags">${tags}</div>
      <p class="ut-panel-desc">${d.desc}</p>
      ${tours.length ? `<div class="ut-tours-heading">Tours (${d.tours.length})</div><div class="ut-tours-list">${tours}</div>` : ''}
      ${d.hub ? `<a class="ut-cta" href="${d.hub}" target="_blank" rel="noopener">
        <span>Explore all tours</span>
        <svg fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>` : ''}
    </div>`;
}

function openPanel(d, el) {
  state.markers.forEach(m => m.element.classList.remove('is-active'));
  if (state.activeId === d.id && panelEl.classList.contains('open')) { closePanel(); return; }
  state.activeId = d.id;
  el.classList.add('is-active');
  panelScroll.innerHTML = buildPanelHTML(d);
  panelScroll.scrollTop = 0;
  panelEl.classList.add('open');
  panelEl.setAttribute('aria-hidden','false');
  document.getElementById('ut-close-btn').addEventListener('click', e => { e.stopPropagation(); closePanel(); });

  // Fly
  const isMobile = window.matchMedia('(max-width:768px)').matches;
  map.flyTo({
    center:[d.lng, d.lat],
    zoom: Math.max(map.getZoom(), 5),
    offset: isMobile ? [0, -80] : [-165, 0],
    duration:700, essential:true
  });
  updateDimming();
}

function closePanel() {
  state.activeId = null;
  panelEl.classList.remove('open');
  panelEl.setAttribute('aria-hidden','true');
  state.markers.forEach(m => m.element.classList.remove('is-active'));
  updateDimming();
}

/* ── DIMMING ── */
function passesFilter(d) {
  if (!state.filter) return true;
  return Array.isArray(d.types) ? d.types.indexOf(state.filter) > -1 : d.types === state.filter;
}

function passesSearch(d, q) {
  if (!q) return true;
  const hay = [d.name, d.country, ...(Array.isArray(d.types)?d.types:[d.types])].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}

function updateDimming() {
  const q = srchState.query;
  state.markers.forEach(({element, dest}) => {
    const ok = passesFilter(dest) && passesSearch(dest, q);
    element.classList.toggle('is-dimmed', !ok);
  });
}

/* ── LEGEND ── */
const legendEl = document.getElementById('ut-legend');
legendEl.querySelectorAll('.ut-legend-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const t = btn.getAttribute('data-t');
    state.filter = state.filter === t ? null : t;
    legendEl.querySelectorAll('.ut-legend-btn').forEach(b => b.classList.toggle('is-active', b.getAttribute('data-t') === state.filter));
    legendEl.classList.toggle('is-filtering', !!state.filter);
    if (state.activeId) {
      const active = DESTS.find(d => d.id === state.activeId);
      if (active && !passesFilter(active)) closePanel();
    }
    updateDimming();
  });
});

/* ── SEARCH ── */
const srchInput = document.getElementById('ut-search-input');
const srchClear = document.getElementById('ut-search-clear');
const srchResults = document.getElementById('ut-search-results');
const srchState = {query:'', hi:-1};

const SEARCHABLE = DESTS.map(d => ({
  dest:d,
  hay:[d.name, d.country, ...(Array.isArray(d.types)?d.types:[d.types]), ...(d.tours||[]).map(t=>t.n)].join(' ').toLowerCase()
}));

function escH(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escR(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function hlM(text,q){return escH(text).replace(new RegExp('('+escR(q)+')','ig'),'<mark>$1</mark>')}

function runSearch(q) {
  srchState.query = q;
  srchState.hi = -1;
  if (!q) {
    srchResults.innerHTML=''; srchResults.classList.remove('show');
    srchClear.classList.remove('show');
    updateDimming(); return;
  }
  srchClear.classList.add('show');
  const ql = q.toLowerCase();
  const matches = SEARCHABLE.filter(e => e.hay.includes(ql)).slice(0,8);
  if (!matches.length) {
    srchResults.innerHTML=`<div class="ut-search-empty">No results for "${escH(q)}"</div>`;
    srchResults.classList.add('show');
    updateDimming(); return;
  }
  const col = (d) => TYPE_COLOR[Array.isArray(d.types)?d.types[0]:d.types]||'#888';
  srchResults.innerHTML = matches.map((e,i) =>
    `<button class="ut-search-result" data-i="${i}" type="button">
      <span class="ut-search-dot" style="background:${col(e.dest)}"></span>
      <span>
        <div class="ut-search-name">${hlM(e.dest.name,q)}</div>
        <div class="ut-search-meta">${escH(e.dest.country)}</div>
      </span>
    </button>`
  ).join('');
  srchResults.classList.add('show');

  srchResults.querySelectorAll('.ut-search-result').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(btn.getAttribute('data-i'));
      const {dest} = matches[idx];
      const me = state.markers.find(m => m.dest.id === dest.id);
      if (me) { me.element.classList.add('is-pulsing'); setTimeout(()=>me.element.classList.remove('is-pulsing'),900); openPanel(dest, me.element); }
      srchResults.classList.remove('show');
      srchInput.value = dest.name;
      srchState.query = '';
      updateDimming();
    });
  });
  updateDimming();
}

srchInput.addEventListener('input', e => runSearch(e.target.value.trim()));
srchClear.addEventListener('click', e => {
  e.stopPropagation(); srchInput.value=''; srchState.query='';
  srchClear.classList.remove('show'); srchResults.classList.remove('show');
  updateDimming();
});
document.addEventListener('click', e => { if (!document.getElementById('ut-search').contains(e.target)) srchResults.classList.remove('show'); });

/* ── RESET ── */
document.getElementById('ut-reset').addEventListener('click', e => {
  e.stopPropagation(); closePanel();
  if (state.filter) { state.filter=null; legendEl.querySelectorAll('.ut-legend-btn').forEach(b=>b.classList.remove('is-active')); legendEl.classList.remove('is-filtering'); }
  srchInput.value=''; srchState.query=''; srchClear.classList.remove('show'); srchResults.classList.remove('show');
  updateDimming();
  map.fitBounds(DEFAULT_BOUNDS, {padding:DEFAULT_PAD, duration:700, maxZoom:5});
});

/* ── INIT ── */
map.on('load', () => {
  buildMarkers();
  map.fitBounds(DEFAULT_BOUNDS, {padding:DEFAULT_PAD, duration:0, maxZoom:5});
});
map.on('click', closePanel);
document.addEventListener('keydown', e => { if(e.key==='Escape'&&panelEl.classList.contains('open')) closePanel(); });
</script>
